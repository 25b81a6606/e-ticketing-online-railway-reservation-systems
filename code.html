<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e-Ticketing Railway Reservation System</title>
    <style>
        /* Compact styling for the form and table layout */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #f4f7f6; color: #333; line-height: 1.6; }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        header { background-color: #003366; color: #fff; padding: 15px; text-align: center; }
        .grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        @media (max-width: 768px) { .grid-layout { grid-template-columns: 1fr; } }
        .panel { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .btn { background-color: #003366; color: white; padding: 10px; border: none; width: 100%; cursor: pointer; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <header><h1>RailReserve Portal</h1></header>
    <div class="container">
        <div class="grid-layout">
            <section class="panel">
                <h2>Search Trains</h2>
                <form>
                    <div class="form-group"><label>From</label><input type="text" placeholder="Origin"></div>
                    <div class="form-group"><label>To</label><input type="text" placeholder="Destination"></div>
                    <div class="form-group"><label>Date</label><input type="date"></div>
                    <button type="submit" class="btn">Search</button>
                </form>
            </section>
            <section class="panel">
                <h2>Passenger Info</h2>
                <form>
                    <div class="form-group"><label>Name</label><input type="text" required></div>
                    <div class="form-group"><label>Age</label><input type="number" required></div>
                    <button type="submit" class="btn">Book</button>
                </form>
            </section>
        </div>
        <section class="panel">
            <h2>Available Trains</h2>
            <table>
                <thead><tr><th>Train</th><th>From</th><th>To</th><th>Seats</th></tr></thead>
                <tbody><tr><td>12952</td><td>BCT</td><td>NDLS</td><td>42</td></tr></tbody>
            </table>
        </section>
    </div>
</body>
</html>
